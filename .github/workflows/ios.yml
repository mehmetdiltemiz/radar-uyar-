# iPhone uygulamasını (imzasız .ipa) GitHub'ın Mac sunucusunda derler.
# İmzalamayı Sideloadly kendi Apple ID'nle yapar.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri kur
        run: npm ci --no-audit --no-fund

      - name: iOS projesini oluştur
        run: npx cap add ios

      - name: İzinleri ve arka plan modunu ayarla
        run: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null || true; }
          pb "Delete :CFBundleDisplayName"
          pb "Add :CFBundleDisplayName string Radar Uyari"
          pb "Set :CFBundleName Radar Uyari"
          pb "Add :NSLocationWhenInUseUsageDescription string Radarlara yaklaştığında seni uyarmak için konumun kullanılır."
          pb "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Ekran kapalıyken de radar uyarısı verebilmek için konumun arka planda kullanılır."
          pb "Add :NSLocationAlwaysUsageDescription string Ekran kapalıyken de radar uyarısı verebilmek için konumun arka planda kullanılır."
          pb "Delete :UIBackgroundModes"
          pb "Add :UIBackgroundModes array"
          pb "Add :UIBackgroundModes:0 string location"
          pb "Add :UIBackgroundModes:1 string audio"
          pb "Add :UIFileSharingEnabled bool true"
          pb "Add :LSSupportsOpeningDocumentsInPlace bool true"
          pb "Delete :UISupportedInterfaceOrientations"
          pb "Add :UISupportedInterfaceOrientations array"
          pb "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait"
          pb "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft"
          pb "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight"
          plutil -lint "$PLIST"

      - name: Web dosyalarını kopyala
        run: npx cap sync ios

      - name: Derle (imzasız)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry RadarUyari.ipa Payload
          ls -lh RadarUyari.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RadarUyari-ipa
          path: RadarUyari.ipa
          retention-days: 90
